[project]
name = "assistant-administratif"
version = "0.1.0"
description = "Assistant administratif universitaire local combinant classification, RAG et Ollama."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "ollama>=0.6.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.66.0",
    "torch>=2.14.1",
]

[project.scripts]
smartcampus-train = "smartcampus_ai.training:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/smartcampus_ai"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
